openapi: 3.2.0
info:
  title: Verifiable API Documentation Credentialing Requests API
  description: '# Introduction


    This document contains the official documentation for the latest version of the Verifiable API.'
  version: 26.12.1.962
servers:
- url: https://discovery.verifiable.com/api
  description: Production
- url: https://discovery-staging.verifiable.com/api
  description: Staging
tags:
- name: CredentialingRequests
  description: These endpoints allow you to create and get credentialing requests.
paths:
  /credentialing-requests/aggregations/owners:
    get:
      tags:
      - CredentialingRequests
      summary: Aggregate provider credentialing request owners
      description: Returns an aggregation of all owners assigned to provider credentialing requests
      operationId: AggregateCredentialingRequestOwners
      parameters:
      - name: providerDeactivated
        in: query
        description: If set, the items will be filtered on requests for the providers with the specified deactivated status.
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BaseUserModel'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Server Error
      security:
      - Bearer: []
  /credentialing-requests:
    post:
      tags:
      - CredentialingRequests
      summary: Create a new credentialing request
      description: Creates a new credentialing request for a provider or facility.
      operationId: CreateCredentialingRequest
      requestBody:
        content:
          application/json:
            schema:
              type: object
              oneOf:
              - $ref: '#/components/schemas/CredentialingRequestProviderRequestModel'
              - $ref: '#/components/schemas/CredentialingRequestFacilityRequestModel'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialingRequestModel'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Server Error
      security:
      - Bearer: []
    get:
      tags:
      - CredentialingRequests
      summary: List credentialing requests
      description: Returns credentialing requests
      operationId: ListCredentialingRequests
      parameters:
      - name: entityType
        in: query
        description: Indicates whether to retrieve credentialing requests for providers or facilities. Defaults to `Providers`.
        schema:
          enum:
          - Provider
          - Facility
          type: string
      - name: currentEventStatus
        in: query
        description: If set, the items will be filtered by the specified current event status.
        schema:
          type: array
          items:
            enum:
            - RequestSubmitted
            - RequestInProgress
            - AdditionalInformationRequested
            - AdditionalInformationSubmitted
            - CancellationRequested
            - Cancelled
            - Completed
            - CompletedWithConcern
            - UnableToComplete
            - SecondAttemptMissingInfo
            - ThirdAttemptMissingInfo
            type: string
      - name: providerCredentialingStatus
        in: query
        description: If set, the items will be filtered by the specified provider credentialing status. Has no effect when querying facilities.
        schema:
          type: array
          items:
            type: string
      - name: priority
        in: query
        description: If set, the items will be filtered by the specified priority.
        schema:
          type: array
          items:
            enum:
            - Low
            - Medium
            - High
            - Urgent
            type: string
      - name: ownerId
        in: query
        description: If set, the items will be filtered by the specified owner.
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: includeUnassigned
        in: query
        description: If set, the items will include credentialing requests that are not assigned to any specified owner. Intended to be used together with `ownerId`.
        schema:
          type: boolean
      - name: credentialingRequestType
        in: query
        description: If set, the items will be filtered by the specified credentialing request type.
        schema:
          enum:
          - Initial
          - ReCredentialing
          - OffCycle
          type: string
      - name: entityId
        in: query
        description: If set, the items will be filtered by the specified entity identifier (`providerId` or `facilityId`).
        schema:
          type: string
          format: uuid
      - name: entityName
        in: query
        description: If set, the items will be filtered by the specified entity name (provider name/alias or facility name).
        schema:
          type: string
      - name: entityNpi
        in: query
        description: If set, the items will be filtered by the specified entity NPI number.
        schema:
          type: integer
          format: int64
      - name: entityDeactivated
        in: query
        description: If set, the items will be filtered by the specified entity deactivated status.
        schema:
          type: boolean
      - name: facilitySpecialtyId
        in: query
        description: If set, the items will be filtered by the specified specialty.
        schema:
          type: string
          format: uuid
      - name: providerId
        in: query
        description: See `entityId`.
        deprecated: true
        schema:
          type: string
          format: uuid
          deprecated: true
      - name: providerName
        in: query
        description: See `entityName`.
        deprecated: true
        schema:
          type: string
          deprecated: true
      - name: providerNpi
        in: query
        description: See `entityNpi`.
        deprecated: true
        schema:
          type: integer
          format: int64
          deprecated: true
      - name: providerDeactivated
        in: query
        description: See `entityDeactivated`.
        deprecated: true
        schema:
          type: boolean
          deprecated: true
      - name: sortedBy
        in: query
        description: The property by which the returned data will be sorted.
        schema:
          enum:
          - Id
          - CreatedAt
          - Priority
          - CurrentEventStatus
          - CurrentEventDate
          - ProviderId
          - ProviderFirstName
          - ProviderLastName
          - ProviderCredentialingStatus
          - FacilityId
          - FacilityName
          type: string
      - name: sort
        in: query
        description: If set, the properties and directions the returned data will be sorted by.
        schema:
          type: object
          properties:
            Keys:
              enum:
              - Id
              - CreatedAt
              - Priority
              - CurrentEventStatus
              - CurrentEventDate
              - ProviderId
              - ProviderFirstName
              - ProviderLastName
              - ProviderCredentialingStatus
              - FacilityId
              - FacilityName
              type: string
            Values:
              enum:
              - Asc
              - Desc
              type: string
      - name: offset
        in: query
        description: The offset for the page to start.
        deprecated: true
        schema:
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to render the page requested. To load the first page send an empty cursor, then the system will generate the cursors to go to the next and/or previous pages automatically.
        schema:
          type: string
      - name: count
        in: query
        description: The number of items to include in a single page.
        schema:
          type: integer
          format: int32
      - name: sortDirection
        in: query
        description: The direction the returned data will be sorted by.
        schema:
          enum:
          - Asc
          - Desc
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialingRequestPageModel'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Server Error
      security:
      - Bearer: []
  /credentialing-requests/{requestId}/events:
    post:
      tags:
      - CredentialingRequests
      summary: Create a new credentialing request event
      description: Creates a new event for a credentialing request event.
      operationId: CreateCredentialingRequestEvent
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialingRequestEventRequestModel'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialingRequestEventModel'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Server Error
      security:
      - Bearer: []
  /credentialing-requests/{requestId}:
    get:
      tags:
      - CredentialingRequests
      summary: Get a specific credentialing request
      description: Returns the data for a specific credentialing request.
      operationId: GetCredentialingRequest
      parameters:
      - name: requestId
        in: path
        description: Identifier of the credentialing request to get the data for.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialingRequestModel'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Server Error
      security:
      - Bearer: []
    patch:
      tags:
      - CredentialingRequests
      summary: Patch an existing credentialing request
      description: Changes properties for an existing credentialing request.
      operationId: PatchCredentialingRequest
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialingRequestPatchModel'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialingRequestModel'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Server Error
      security:
      - Bearer: []
  /credentialing-requests/aggregations:
    get:
      tags:
      - CredentialingRequests
      summary: Get credentialing requests aggregations
      description: Returns aggregated counts for provider or facility credentialing requests.
      operationId: GetCredentialingRequestAggregations
      parameters:
      - name: entityDeactivated
        in: query
        description: If set, the items will be filtered based on the deactivated status of entities. If not specified, all entities are included regardless of deactivation status.
        schema:
          type: boolean
      - name: entityType
        in: query
        description: The entity type to be used for filtering items. Valid values are `Practitioner` or `Facility`. Default is `Practitioner`.
        schema:
          enum:
          - Practitioner
          - Facility
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialingRequestAggregationModel'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Server Error
      security:
      - Bearer: []
  /credentialing-requests/{requestId}/events/{eventId}:
    get:
      tags:
      - CredentialingRequests
      summary: Get a specific credentialing request event
      description: Returns the data for a specific credentialing request event.
      operationId: GetCredentialingRequestEvent
      parameters:
      - name: requestId
        in: path
        description: Identifier of the credentialing request to get the data for.
        required: true
        schema:
          type: string
          format: uuid
      - name: eventId
        in: path
        description: Identifier of the credentialing request event to get the data for.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialingRequestEventModel'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Server Error
      security:
      - Bearer: []
  /facilities/{facilityId}/credentialing-data:
    get:
      tags:
      - CredentialingRequests
      summary: Get the credentialing data for a facility
      description: Returns the credentialing data for a facility.
      operationId: GetFacilityCredentialingData
      parameters:
      - name: facilityId
        in: path
        description: Identifier of the facility to get the data for.
        required: true
        schema:
          type: string
          format: uuid
      - name: credentialingRequestId
        in: query
        description: Identifier of the credentialing request associated to the facility.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityCredentialingDataModel'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Server Error
      security:
      - Bearer: []
  /providers/{providerId}/credentialing-data:
    get:
      tags:
      - CredentialingRequests
      summary: Get the credentialing data for a provider
      description: Returns the credentialing data for a provider.
      operationId: GetProviderCredentialingData
      parameters:
      - name: providerId
        in: path
        description: Identifier of the provider to get the data for.
        required: true
        schema:
          type: string
          format: uuid
      - name: credentialingRequestId
        in: query
        description: Identifier of the credentialing request associated to the provider.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCredentialingDataModel'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Server Error
      security:
      - Bearer: []
  /credentialing-requests/{requestId}/checklist:
    put:
      tags:
      - CredentialingRequests
      summary: Create or replace a credentialing request checklist
      description: Creates or replaces a checklist for a credentialing request.
      operationId: CreateCredentialingRequestChecklist
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialingRequestChecklistRequestModel'
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoContentResult'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Server Error
      security:
      - Bearer: []
components:
  schemas:
    ProviderProfileImportModel:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier associated with this provider profile import.
          format: uuid
        providerId:
          type: string
          description: The provider unique identifier associated with this profile import.
          format: uuid
        source:
          enum:
          - Npi
          - CaqhPo
          - AmericanMedicalAssociationPhysician
          - AmericanMedicalAssociationPhysicianAssistant
          type: string
          description: Source of the import.
          example: CaqhPo
        started:
          type: string
          description: TimeStamp of this import when started
          format: date-time
        completed:
          type: string
          description: TimeStamp of this import when completed or `null` if is still in progress.
          format: date-time
        status:
          enum:
          - Pending
          - Working
          - Completed
          - Failed
          type: string
          description: Status of the import. If it is `Pending` or `Working` it means that we are busy performing the import. Once the status is `Completed` or `Failed` the import is done.
        trigger:
          enum:
          - Manual
          - Automated
          type: string
          description: Type of trigger for this import.
        failureCode:
          enum:
          - DatabaseError
          - InvalidImportSourceError
          - UnknownError
          - ParseError
          - NpiSourceError
          - ImportError
          - ImportRequestError
          - SourceError
          - NoContent
          - BadRequest
          - Unauthorized
          - Forbidden
          - NotFound
          - NotAcceptable
          - RequestTimeout
          - TooManyRequests
          - InternalServerError
          - BadGateway
          - ServiceUnavailable
          - GatewayTimeout
          type: string
          description: If set it means there was an error during the import or `null` when no errors happened.
        failureReason:
          $ref: '#/components/schemas/FailureModel'
        profile:
          $ref: '#/components/schemas/ProviderProfileModel'
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/IProviderParameter'
      additionalProperties: false
    LicenseVerificationResultModel:
      type: object
      properties:
        name:
          type: string
          description: Name of the provider as indicated by the source.
        licenseType:
          type: string
          description: Textual description of the license type as indicated by the source.
        licenseStatus:
          type: string
          description: Textual description of the license status as indicated by the source.
        licenseNumber:
          type: string
          description: License number as indicated by the source.
        address:
          type: string
          description: Address of the license holder as indicated by the source.
        issued:
          type: string
          description: Timestamp when the license was issued as indicated by the source.
          format: date-time
        expires:
          type: string
          description: Timestamp when the license expires as indicated by the source.
          format: date-time
        screenshots:
          type: array
          items:
            type: string
          description: Array of paths to screenshots that were taken as proof of the license verification.
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/LicenseVerificationAttachmentModel'
          description: Array of attachments related to the verification that were taken from the source.
        disciplinaryActions:
          $ref: '#/components/schemas/FlexibleDataModel'
        additionalProperties:
          $ref: '#/components/schemas/FlexibleDataModel'
        problems:
          type: array
          items:
            enum:
            - NameMismatch
            - LicenseTypeMismatch
            type: string
          description: Array of problems that resulted in a `NeedsReview` status for the license verification.
        prescriptiveAuthority:
          type: string
          description: Indicates whether the provider is legally authorized to prescribe medications, as reported by the licensing authority.
        compactStatus:
          type: string
          description: Indicates whether the provider holds a multistate/interstate practice privilege under an applicable compact, as reported by the licensing authority.
      additionalProperties: false
    NpdbAffiliation:
      type: object
      properties:
        entityName:
          type:
          - string
          - 'null'
        entityAddress:
          $ref: '#/components/schemas/NormalizedAddress'
        natureOfRelationship:
          type:
          - string
          - 'null'
        otherNatureOfRelationship:
          type:
          - string
          - 'null'
      additionalProperties: false
    CredentialingRequestFacilityRequestModel:
      required:
      - facilityId
      - facilitySpecialtyIds
      type: object
      properties:
        facilityId:
          type: string
          description: The unique identifier of the facility associated with this credentialing request.
          format: uuid
        facilitySpecialtyIds:
          type: array
          items:
            type: string
            format: uuid
          description: List of facility specialties. Required for facility credentialing request.
        type:
          enum:
          - Initial
          - ReCredentialing
          - OffCycle
          type: string
          description: The type of credentialing request. If not specified, this will default to `Initial`.
        priority:
          enum:
          - Low
          - Medium
          - High
          - Urgent
          type: string
          description: The priority of credentialing request. If not specified, this will default to `Medium`.
        isSelfManaged:
          type: boolean
          description: If the flag is set, self-managed credentialing request will be created.
        applicationReceivedDate:
          type: string
          format: date
      additionalProperties: false
      example:
        facilityId: d7244f5b-52c1-4d27-b4f5-43b1113fc304
        facilitySpecialtyIds:
        - 497f6eca-6276-4993-bfeb-53cbbbba6f08
        type: Initial
        priority: Low
        isSelfManaged: true
    OfacAddressRecord:
      type: object
      properties:
        addressRemarks:
          type:
          - string
          - 'null'
        address:
          type:
          - string
          - 'null'
      additionalProperties: false
    AbmsPersonalInfo:
      type: object
      properties:
        restrictions:
          type:
          - string
          - 'null'
        physicalStatus:
          type:
          - string
          - 'null'
        dateOfBirth:
          type:
          - string
          - 'null'
          format: date-time
        dateOfBirthAccuracy:
          type:
          - string
          - 'null'
        dateOfBirthRestriction:
          type:
          - string
          - 'null'
        deceasedDate:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
    CaqhProfile.NonAdmittingAffiliation:
      type: object
      properties:
        hospitalName:
          type:
          - string
          - 'null'
        address:
          $ref: '#/components/schemas/CaqhProfile.CaqhAddress'
        phone:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
        startDate:
          type:
          - string
          - 'null'
          format: date-time
        endDate:
          type:
          - string
          - 'null'
          format: date-time
        reasonForDiscontinuance:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
      additionalProperties: false
    CaqhProfile.ProviderIdentifier:
      type: object
      properties:
        number:
          type:
          - string
          - 'null'
        state:
          type:
          - string
          - 'null'
        isParticipatingProvider:
          type:
          - boolean
          - 'null'
      additionalProperties: false
    PersonName:
      type: object
      properties:
        lastName:
          type:
          - string
          - 'null'
        firstName:
          type:
          - string
          - 'null'
        middleName:
          type:
          - string
          - 'null'
      additionalProperties: false
    DatasetMetadata:
      type: object
      properties:
        importDate:
          type: string
          description: The date of the import file that the dataset scan was compared against.
          format: date
        importFileName:
          type: string
          description: The original file name of the dataset source.
      additionalProperties: false
    Enrollment:
      type: object
      properties:
        enrollments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EnrollmentInfo'
        studentAddress:
          $ref: '#/components/schemas/NscAddress'
      additionalProperties: false
    ProviderDateOfBirthParameter:
      type: object
      properties:
        type:
          enum:
          - Name
          - Npi
          - DateOfBirth
          - Ssn
          - License
          - Address
          - Education
          - BoardCertificationNumber
          - Dea
          - Certificate
          - CaqhId
          - ProviderType
          - FacilityName
          - FacilityAccreditationInfo
          - FacilityCmsCertificationInfo
          - NccpaBoardCertificateInfo
          - Gender
          type: string
          readOnly: true
        dateOfBirth:
          type: string
          format: date-time
      additionalProperties: false
    CertificateDatasetRecord:
      type: object
      properties:
        certificateType:
          type:
          - string
          - 'null'
        certificateNumber:
          type:
          - string
          - 'null'
        firstName:
          type:
          - string
          - 'null'
        lastName:
          type:
          - string
          - 'null'
        middleName:
          type:
          - string
          - 'null'
        prefix:
          type:
          - string
          - 'null'
        suffix:
          type:
          - string
          - 'null'
        issueDate:
          type:
          - string
          - 'null'
          format: date-time
        expirationDate:
          type:
          - string
          - 'null'
          format: date-time
        certifyingOrganization:
          type:
          - string
          - 'null'
        additionalProperties:
          $ref: '#/components/schemas/FlexibleDataModel'
        attachments:
          type:
          - array
          - 'null'
          items:
            type: string
        id:
          type: string
          format: uuid
        hash:
          type: string
          format: uuid
        fullName:
          type:
          - string
          - 'null'
      additionalProperties: false
    CaqhProfile.MilitaryService:
      type: object
      properties:
        isOnActiveMilitaryDuty:
          type:
          - boolean
          - 'null'
        isInReservesOrNationalGuard:
          type:
          - boolean
          - 'null'
      additionalProperties: false
    ProviderAliasModel:
      type: object
      properties:
        firstName:
          type: string
          description: The first (given) name of this alias.
        lastName:
          type: string
          description: The last (family) name of this alias.
        id:
          type: string
          description: Unique identifier for this alias.
          format: uuid
      additionalProperties: false
    CaqhProfile.Specialty:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        boardCertificationNumber:
