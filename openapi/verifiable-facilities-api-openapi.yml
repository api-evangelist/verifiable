        phoneNumber:
          type: string
          description: Phone number associated with the facility.
        faxNumber:
          type: string
          description: Fax number associated with the facility.
        groupTaxId:
          type: string
          description: The group tax id associated with the facility.
        facilityTaxId:
          type: string
