openapi: 3.2.0
info:
  title: Verifiable API Documentation Facilities API
  description: '# Introduction


    This document contains the official documentation for the latest version of the Verifiable API.'
  version: 26.12.1.962
servers:
- url: https://discovery.verifiable.com/api
  description: Production
- url: https://discovery-staging.verifiable.com/api
  description: Staging
tags:
- name: Facilities
  description: Endpoints related to managing and retrieving Facility data.
paths:
  /facilities:
    post:
      tags:
      - Facilities
      summary: Create a new facility
      description: Creates a new facility that can be used to store information about the facility.
      operationId: CreateFacility
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityRequestModel'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityModel'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Server Error
      security:
      - Bearer: []
    get:
      tags:
      - Facilities
      summary: List facilities
      description: Returns a page of facilities.
      operationId: ListFacilities
      parameters:
      - name: name
        in: query
        description: If set, the items will be filtered on facilities with the specified name.
        schema:
          type: string
      - name: deactivated
        in: query
        description: If set, the items will be filtered on facilities with the specified deactivated status.
        schema:
          type: boolean
      - name: parentFacilityId
        in: query
        schema:
          type: string
          format: uuid
      - name: sortedBy
        in: query
        description: The property by which the returned data will be sorted.
        schema:
          enum:
          - Id
          - Name
          type: string
      - name: sort
        in: query
        description: If set, the properties and directions the returned data will be sorted by.
        schema:
          type: object
          properties:
            Keys:
              enum:
              - Id
              - Name
              type: string
            Values:
              enum:
              - Asc
              - Desc
              type: string
      - name: offset
        in: query
        description: The offset for the page to start.
        deprecated: true
        schema:
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to render the page requested. To load the first page send an empty cursor, then the system will generate the cursors to go to the next and/or previous pages automatically.
        schema:
          type: string
      - name: count
        in: query
        description: The number of items to include in a single page.
        schema:
          type: integer
          format: int32
      - name: sortDirection
        in: query
        description: The direction the returned data will be sorted by.
        schema:
          enum:
          - Asc
          - Desc
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityPageModel'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Server Error
      security:
      - Bearer: []
  /facilities/{facilityId}:
    get:
      tags:
      - Facilities
      summary: Get an existing facility
      description: Returns the data for a specific facility.
      operationId: GetFacility
      parameters:
      - name: facilityId
        in: path
        description: Identifier of the facility to get the data for.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityModel'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Server Error
      security:
      - Bearer: []
    patch:
      tags:
      - Facilities
      summary: Patch an existing facility
      description: Allows you to change a facility's name or other data properties.
      operationId: PatchFacility
      parameters:
      - name: facilityId
        in: path
        description: Identifier of the facility to patch.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityPatchModel'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityModel'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Server Error
      security:
      - Bearer: []
  /facilities/license-types:
    get:
      tags:
      - Facilities
      summary: List facility license types
      description: Returns a page of facility license types.
      operationId: ListFacilityLicenseTypes
      parameters:
      - name: name
