openapi: 3.2.0
info:
  title: Verifiable API Documentation Datasets API
  description: '# Introduction


    This document contains the official documentation for the latest version of the Verifiable API.'
  version: 26.12.1.962
servers:
- url: https://discovery.verifiable.com/api
  description: Production
- url: https://discovery-staging.verifiable.com/api
  description: Staging
tags:
- name: Datasets
  description: Endpoints related to scanning datasets and reading resulting matches. The supported datasets will grow over time and can be discovered via the ListDatasets endpoint. A dataset scan is asynchronous, but most scans will result in near immediate completion. A webhook of type DatasetScanCompleted is triggered upon completion, but you can also check the completion status by querying the GetDatasetScan operation.
paths:
  /datasets/scans:
    post:
      tags:
      - Datasets
      summary: Start a dataset scan
      description: 'Starts a new dataset scan.


        Will return a failed scan if required parameters are missing.'
      operationId: StartDatasetScan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetScanRequestModel'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetScanModel'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '409':
          description: Conflict
        '500':
          description: Server Error
      security:
      - Bearer: []
    get:
      tags:
      - Datasets
      summary: List dataset scans
      description: Returns a page of dataset scans.
      operationId: ListDatasetScans
      parameters:
      - name: sortDirection
        in: query
        description: The direction the returned data will be sorted by.
        schema:
          enum:
          - Asc
          - Desc
          type: string
      - name: sortedBy
        in: query
        description: The property by which the returned data will be sorted.
        schema:
          enum:
          - Id
          - Started
          - Completed
          - Type
          - ProviderId
          - ProviderFirstName
          - ProviderLastName
          - FacilityId
          - FacilityName
          type: string
      - name: type
        in: query
        description: If set, the results will only contain scans with the specified dataset types.
        schema:
          type: array
          items:
            enum:
            - Sam
            - MedicareOptOut
            - OigFugitives
            - OfacSdn
            - OfacConsolidated
            - OigExclusions
            - StateSanctionsAndExclusions
            - Npdb
            - Dmf
            - Npi
            - Nsc
            - Dea
            - CmsPreclusion
