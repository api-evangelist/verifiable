              - SupportsAliases
              - SupportsMatchRelevance
              - SupportsContinuousMonitoring
              - SupportsOnDemandScanning
              - SupportsMonitoring
              type: string
              description: '* `SupportsMultipleMonitors` - Indicates whether the dataset supports multiple monitoring configurations.

                * `SupportsReferences` - Indicates if the Dataset uses a referenceId as a trigger for the scan.

                * `SupportsAliases` - Indicates if the dataset can utilize provider aliases to identify matches.

                * `SupportsMatchRelevance` - Indicates if the dataset supports the MatchRelevancePreference to adjust match accuracy.

                * `SupportsContinuousMonitoring` - Currently unique to the NPDB dataset, indicates if continuous monitoring is available.

                * `SupportsOnDemandScanning` - Indicates whether the dataset allows scans to be triggered on demand and in multiple instances.

                * `SupportsMonitoring` - Indicates if a monitor can be created.'
            Values:
              type: boolean
          description: Indicates the capabilities for this dataset. Currently the only capability that can differ per dataset is if records can be ignored or not.
          readOnly: true
