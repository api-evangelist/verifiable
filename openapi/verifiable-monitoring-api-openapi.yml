        additionalInfo:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - string
            - 'null'
        id:
          type: string
          format: uuid
        hash:
          type: string
          format: uuid
        address:
          type:
          - string
          - 'null'
        dateOfBirth:
          type:
          - string
          - 'null'
          format: date-time
        fullName:
