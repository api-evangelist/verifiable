openapi: 3.2.0
info:
  title: Verifiable API Documentation Providers API
  description: '# Introduction


    This document contains the official documentation for the latest version of the Verifiable API.'
  version: 26.12.1.962
servers:
- url: https://discovery.verifiable.com/api
  description: Production
- url: https://discovery-staging.verifiable.com/api
  description: Staging
tags:
- name: Providers
  description: Endpoints related to managing and listing providers. A provider must be created and associated with license numbers, NPI numbers or other identifiers that can be used to perform lookups to fetch associated data for this provider. The data registered on the provider will be matched against the data returned by these lookups and used to detect inconsistencies or problems in the data or licenses.
paths:
  /providers:
    post:
      tags:
      - Providers
      summary: Create a new provider
      description: Creates a new provider that can be used to store information about this provider. Once a provider is created you can attach records, notes, documents and create other associations with this provider such as adding them to a Group or Payer.
      operationId: CreateProvider
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderRequestModel'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderModel'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Server Error
      security:
      - Bearer: []
    get:
      tags:
      - Providers
      summary: List providers
      description: Returns a page of providers.
      operationId: ListProviders
      parameters:
      - name: status
        in: query
        description: If set, the items will be filtered on providers with the specified status.
        schema:
          enum:
          - None
          - NeedsReview
          - ExpiresSoon
          - Expired
          - Monitored
          - NotMonitored
          - NotFoundLicenses
          - DisciplinaryActionLicenses
          - UnableToVerifyLicenses
          type: string
      - name: providerName
        in: query
        description: If set, the items will be filtered on providers with the specified name or alias name.
        schema:
          type: string
      - name: credentialingStatus
        in: query
        description: If set, the items will be filtered on providers with the specified credentialing status.
        schema:
          type: array
          items:
            type: string
      - name: providerTypeId
        in: query
        description: If set, the items will be filtered on providers with the specified provider type.
        schema:
          type: string
          format: uuid
      - name: npi
        in: query
        description: If set, the items will be filtered on providers with the specified npi number.
        schema:
          type: integer
          format: int64
      - name: deactivated
        in: query
        description: If set, the items will be filtered on providers with the specified deactivated status.
        schema:
          type: boolean
      - name: nextCredentialingDateOnOrAfter
        in: query
        description: If set, the items will be filtered on providers with the specified next credentialing date that is equal to or greater than the date specified.
        schema:
          type: string
          format: date
      - name: nextCredentialingDateOnOrBefore
        in: query
        description: If set, the items will be filtered on providers with the specified next credentialing date that is equal to or less than the date specified.
        schema:
          type: string
          format: date
      - name: sortedBy
        in: query
        description: The property by which the returned data will be sorted.
        schema:
          enum:
          - Id
          - LastName
          - FirstName
          - CredentialingStatus
          - CredentialedDate
          type: string
      - name: sort
        in: query
        description: If set, the properties and directions the returned data will be sorted by.
        schema:
          type: object
          properties:
            Keys:
              enum:
              - Id
              - LastName
              - FirstName
              - CredentialingStatus
              - CredentialedDate
              type: string
            Values:
              enum:
              - Asc
              - Desc
              type: string
      - name: offset
        in: query
        description: The offset for the page to start.
        deprecated: true
        schema:
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to render the page requested. To load the first page send an empty cursor, then the system will generate the cursors to go to the next and/or previous pages automatically.
        schema:
          type: string
      - name: count
        in: query
        description: The number of items to include in a single page.
        schema:
          type: integer
          format: int32
      - name: sortDirection
        in: query
        description: The direction the returned data will be sorted by.
        schema:
          enum:
          - Asc
          - Desc
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPageModel'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Server Error
      security:
      - Bearer: []
  /providers/{providerId}:
    get:
      tags:
      - Providers
      summary: Get an existing provider
      description: Returns the data for a specific provider.
      operationId: GetProvider
      parameters:
      - name: providerId
        in: path
        description: Identifier of the provider to get the data for.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderModel'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Server Error
      security:
      - Bearer: []
    patch:
      tags:
      - Providers
      summary: Patch an existing provider
      description: Allows you to change a provider's name or other data properties.
      operationId: PatchProvider
      parameters:
      - name: providerId
        in: path
        description: Identifier of the provider to patch.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderPatchModel'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderModel'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Server Error
      security:
      - Bearer: []
    delete:
      tags:
      - Providers
      summary: Delete an existing provider
      description: This will delete the provider and all associated data such as attached licenses, NPI records, DEA registration etc.
      operationId: DeleteProvider
      parameters:
      - name: providerId
        in: path
        description: Identifier of the provider to get the data for.
        required: true
        schema:
          type: string
          format: uuid
      - name: cancelNpdbContinuousQuery
        in: query
        schema:
          type: boolean
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Server Error
      security:
      - Bearer: []
  /providers/aggregations:
    get:
      tags:
      - Providers
      summary: Get provider aggregations
      description: Returns aggregated counts for providers with different statuses.
      operationId: GetProviderAggregations
      parameters:
      - name: providerDeactivated
        in: query
        description: If set, the items will be filtered on providers with the specified deactivated status.
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderAggregationsModel'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Server Error
      security:
      - Bearer: []
  /providertypes:
    get:
      tags:
      - Providers
      summary: List provider types
      description: Returns a list of all provider types that are currently supported.
      operationId: ListProviderTypes
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderTypeModel'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Server Error
      security:
      - Bearer: []
  /providers/{providerId}/report:
    post:
      tags:
      - Providers
      summary: Generate report for an existing provider
      description: Generates report for the specified provider.
      operationId: ReportProvider
      parameters:
      - name: providerId
        in: path
        description: Identifier of the provider to generate report.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderReportRequestModel'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
                format: binary
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Server Error
      security:
      - Bearer: []
  /providers/recredentialing/due:
    get:
      tags:
      - Providers
      summary: List providers due for recredentialing
      description: Returns a page of providers due for recredentialing.
      operationId: ListProvidersDueForRecredentialing
      parameters:
      - name: includeUnassigned
        in: query
        schema:
          type: boolean
      - name: providerName
        in: query
        description: If set, the items will be filtered on providers with the specified name or alias name.
        schema:
          type: string
      - name: providerNpi
        in: query
        description: If set, the items will be filtered on providers with the specified npi number.
        schema:
          type: integer
          format: int64
      - name: credentialingRequestOwnerId
        in: query
        description: If set, the items will be filtered on providers with the specified credentialing request owner IDs.
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: credentialingRequestEventStatus
        in: query
        description: If set, the items will be filtered on providers with the specified credentialing request event statuses.
        schema:
          type: array
          items:
            enum:
            - RequestSubmitted
            - RequestInProgress
            - AdditionalInformationRequested
            - AdditionalInformationSubmitted
            - CancellationRequested
            - Cancelled
            - Completed
            - CompletedWithConcern
            - UnableToComplete
            - SecondAttemptMissingInfo
            - ThirdAttemptMissingInfo
            type: string
      - name: nextCredentialingDateOnOrAfter
        in: query
        description: If set, the items will be filtered on providers with the specified next credentialing date that is equal to or greater than the date specified.
        schema:
          type: string
          format: date
      - name: nextCredentialingDateOnOrBefore
        in: query
        description: If set, the items will be filtered on providers with the specified next credentialing date that is equal to or less than the date specified.
        schema:
          type: string
          format: date
      - name: sortedBy
        in: query
        description: The property by which the returned data will be sorted.
        schema:
          enum:
          - ProviderFirstName
          - ProviderLastName
          - RequestCreatedAt
          type: string
      - name: sort
        in: query
        description: If set, the properties and directions the returned data will be sorted by.
        schema:
          type: object
          additionalProperties:
            enum:
            - Asc
            - Desc
            type: string
      - name: offset
        in: query
        description: The offset for the page to start.
        deprecated: true
        schema:
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to render the page requested. To load the first page send an empty cursor, then the system will generate the cursors to go to the next and/or previous pages automatically.
        schema:
          type: string
      - name: count
        in: query
        description: The number of items to include in a single page.
        schema:
          type: integer
          format: int32
      - name: sortDirection
        in: query
        description: The direction the returned data will be sorted by.
        schema:
          enum:
          - Asc
          - Desc
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDueForRecredentialingPageModel'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Server Error
      security:
      - Bearer: []
  /providers/monitoring/sanctions-and-exclusions/aggregations:
    get:
      tags:
      - Providers
      summary: Get provider sanctions and exclusions monitoring categories aggregations
      description: Returns aggregated counts for providers monitoring categories for sanctions and exclusions.
      operationId: GetProviderMonitoringSanctionsAndExclusionsSummaryAggregations
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderMonitoringSanctionsAndExclusionsSummaryAggregationsModel'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Server Error
      security:
      - Bearer: []
  /providers/monitoring/sanctions-and-exclusions:
    get:
      tags:
      - Providers
      summary: List provider monitoring summary for sanctions and exclusions
      description: Returns a page of provider monitoring summaries for sanctions and exclusions.
      operationId: ListProviderMonitoringSanctionsAndExclusionsSummary
      parameters:
      - name: name
        in: query
        description: If set, the items will be filtered on providers with the specified name/alias.
        schema:
          type: string
      - name: npi
        in: query
        description: If set, the items will be filtered on providers with the specified NPI number.
        schema:
          type: integer
          format: int64
      - name: credentialingStatus
        in: query
        description: If set, the items will be filtered on providers with the specified credentialing status.
        schema:
          type: array
          items:
            type: string
      - name: monitoringCategory
        in: query
        description: If set, the items will be filtered on providers with the specified monitoring category.
        schema:
          enum:
          - NotMonitored
          - PartiallyMonitored
          - FullyMonitored
          type: string
      - name: sortedBy
        in: query
        schema:
          enum:
          - FirstName
          - LastName
          - CredentialingStatus
          type: string
      - name: sort
        in: query
        description: If set, the properties and directions the returned data will be sorted by.
        schema:
          type: object
          properties:
            Keys:
              enum:
              - FirstName
              - LastName
              - CredentialingStatus
              type: string
            Values:
              enum:
              - Asc
              - Desc
              type: string
      - name: offset
        in: query
        description: The offset for the page to start.
        deprecated: true
        schema:
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to render the page requested. To load the first page send an empty cursor, then the system will generate the cursors to go to the next and/or previous pages automatically.
        schema:
          type: string
      - name: count
        in: query
        description: The number of items to include in a single page.
        schema:
          type: integer
          format: int32
      - name: sortDirection
        in: query
        description: The direction in which the returned data will be sorted.
        schema:
          enum:
          - Asc
          - Desc
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderMonitoringSanctionsAndExclusionsSummaryPageModel'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Server Error
      security:
      - Bearer: []
  /providers/{providerId}/npdb/transfer-enrollment:
    post:
      tags:
      - Providers
      summary: Initiate an NPDB enrollment transfer for a provider
      description: Initiates the transfer of an existing an NPDB enrollment to the specified provider. Once a transfer has been initiated, review the dataset scan results to monitor the transfer operation.
      operationId: TransferNpdbEnrollment
      parameters:
      - name: providerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferNpdbRequestModel'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferNpdbResponseModel'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Conflict
        '500':
          description: Server Error
        '503':
          description: Server Error
      security:
      - Bearer: []
components:
  schemas:
    NpdbAffiliation:
      type: object
      properties:
        entityName:
          type:
          - string
          - 'null'
        entityAddress:
          $ref: '#/components/schemas/NormalizedAddress'
        natureOfRelationship:
          type:
          - string
          - 'null'
        otherNatureOfRelationship:
          type:
          - string
          - 'null'
      additionalProperties: false
    ProviderPatchModel:
      type: object
      properties:
        firstName:
          type: string
          description: If set, the provider's `firstName` will be updated with this value.
        lastName:
          type: string
          description: If set, the provider's `lastName` will be updated with this value.
        dateOfBirth:
          type: string
          description: If set, the provider's `dateOfBirth` will be updated with this value.
          format: date-time
        ssn:
          type: string
          description: If set, the provider's `ssn` will be updated with this value.
        npi:
          type: integer
          description: The 10 digit National Provider Identifiers (NPI) of this provider
          format: int64
        aliases:
          type: array
          items:
            $ref: '#/components/schemas/ProviderAliasRequestModel'
          description: If set, the provider's `aliases` will be updated with this value. To remove the aliases pass an empty array.
        primaryPracticeState:
          enum:
          - AL
          - AK
          - AZ
          - AR
          - CA
          - CO
          - CT
          - DE
          - DC
          - FL
          - GA
          - HI
          - ID
          - IL
          - IN
          - IA
          - KS
          - KY
          - LA
          - ME
          - MD
          - MA
          - MI
          - MN
          - MS
          - MO
          - MT
          - NE
          - NV
          - NH
          - NJ
          - NM
          - NY
          - NC
          - ND
          - OH
          - OK
          - OR
          - PA
          - RI
          - SC
          - SD
          - TN
          - TX
          - UT
          - VT
          - VA
          - WA
          - WV
          - WI
          - WY
          - AS
          - GU
          - MP
          - PR
          - VI
          type: string
          description: The primary practice state of the provider.
        additionalPracticeStates:
          type: array
          items:
            enum:
            - AL
            - AK
            - AZ
            - AR
            - CA
            - CO
            - CT
            - DE
            - DC
            - FL
            - GA
            - HI
            - ID
            - IL
            - IN
            - IA
            - KS
            - KY
            - LA
            - ME
            - MD
            - MA
            - MI
            - MN
            - MS
            - MO
            - MT
            - NE
            - NV
            - NH
            - NJ
            - NM
            - NY
            - NC
            - ND
            - OH
            - OK
            - OR
            - PA
            - RI
            - SC
            - SD
            - TN
            - TX
            - UT
            - VT
            - VA
            - WA
            - WV
            - WI
            - WY
            - AS
            - GU
            - MP
            - PR
            - VI
            type: string
          description: Additional practice states of the provider. Cannot include the primary practice state.
        gender:
          enum:
          - Unknown
          - Male
          - Female
          - NonBinaryOrThirdGender
          - Other
          - PreferNotToSay
          type: string
          description: Provider's gender (optional).
        ethnicity:
          type: array
          items:
            enum:
            - AmericanIndianOrAlaskaNative
            - Asian
            - BlackOrAfricanAmerican
            - HispanicOrLatino
            - NativeHawaiianOrOtherPacificIslander
            - White
            - PreferNotToSay
            - NoInformationToAnswer
            type: string
          description: Provider's ethnicity (optional).
        credentialingStatus:
          type: string
          description: If set, the provider's `credentialingStatus` will be updated with this value.
        emails:
          type: array
          items:
            $ref: '#/components/schemas/ProviderEmailRequestModel'
          description: If set, the provider's `emails` will be updated with this value. To remove the emails pass an empty array.
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/ProviderAddressRequestModel'
          description: If set, the provider's `addresses` will be updated with this value. To remove the addresses pass an empty array.
        phone:
          type: string
          description: Primary phone number associated with this provider
        languages:
          type: array
          items:
            type: string
          description: A list of languages, other than English, this provider speaks.
        credentialedDate:
          type: string
          description: Date this provider was originally credentialed
          format: date-time
        nextCredentialingDate:
          type: string
          description: Date this provider should be credentialed next
          format: date
        recredentialedDates:
          type: array
          items:
            type: string
            format: date-time
          description: A list of dates when this provider was re-credentialed.
        providerTypeId:
          type: string
          description: Provider type id associated with this provider.
          format: uuid
        nuccGroupId:
          type: string
          description: If set, the provider's NUCC Taxonomy Group will be updated with this value.
          format: uuid
        segmentId:
          type: string
          description: If set, the provider's segment will be updated to this value. Used to reassign providers between segments in multi-tenant organizations.
          format: uuid
        deactivated:
          type: boolean
          description: If set to true, the provider will be deactivated. If set to false, the provider will be activated.
      additionalProperties: false
    OfacAddressRecord:
      type: object
      properties:
        addressRemarks:
          type:
          - string
          - 'null'
        address:
          type:
          - string
          - 'null'
      additionalProperties: false
    AbmsPersonalInfo:
      type: object
      properties:
        restrictions:
          type:
          - string
          - 'null'
        physicalStatus:
          type:
          - string
          - 'null'
        dateOfBirth:
          type:
          - string
          - 'null'
          format: date-time
        dateOfBirthAccuracy:
          type:
          - string
          - 'null'
        dateOfBirthRestriction:
          type:
          - string
          - 'null'
        deceasedDate:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
    PersonName:
      type: object
      properties:
        lastName:
          type:
          - string
          - 'null'
        firstName:
          type:
          - string
          - 'null'
        middleName:
          type:
          - string
          - 'null'
      additionalProperties: false
    DatasetMetadata:
      type: object
      properties:
        importDate:
          type: string
          description: The date of the import file that the dataset scan was compared against.
          format: date
        importFileName:
          type: string
          description: The original file name of the dataset source.
      additionalProperties: false
    Enrollment:
      type: object
      properties:
        enrollments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EnrollmentInfo'
        studentAddress:
          $ref: '#/components/schemas/NscAddress'
      additionalProperties: false
    ProviderDateOfBirthParameter:
      type: object
      properties:
        type:
          enum:
          - Name
          - Npi
          - DateOfBirth
          - Ssn
          - License
          - Address
          - Education
          - BoardCertificationNumber
          - Dea
          - Certificate
          - CaqhId
          - ProviderType
          - FacilityName
          - FacilityAccreditationInfo
          - FacilityCmsCertificationInfo
          - NccpaBoardCertificateInfo
          - Gender
          type: string
          readOnly: true
        dateOfBirth:
          type: string
          format: date-time
      additionalProperties: false
    CertificateDatasetRecord:
      type: object
      properties:
        certificateType:
          type:
          - string
          - 'null'
        certificateNumber:
          type:
          - string
          - 'null'
        firstName:
          type:
          - string
          - 'null'
        lastName:
          type:
          - string
          - 'null'
        middleName:
          type:
          - string
          - 'null'
        prefix:
          type:
          - string
          - 'null'
        suffix:
          type:
          - string
          - 'null'
        issueDate:
