openapi: 3.2.0
info:
  title: Verifiable API Documentation Providers Info API
  description: '# Introduction


    This document contains the official documentation for the latest version of the Verifiable API.'
  version: 26.12.1.962
servers:
- url: https://discovery.verifiable.com/api
  description: Production
- url: https://discovery-staging.verifiable.com/api
  description: Staging
tags:
- name: ProvidersInfo
  description: Endpoints related to managing and listing providers' info. Education, insurance, training and CAQH login info can be added to providers. Education, liability insurance, and training can have multiple entries. They can be created via POST, modified by PATCH, and removed by DELETE methods. CAQH login info is a single entry per provider and can be created or replaced by PUT, removed by DELETE and modified by PATCH method.
paths:
  /providers/{providerId}/info:
    get:
      tags:
      - ProvidersInfo
      summary: Get info for the existing provider
      description: Returns the info for a specific provider.
      operationId: GetProviderInfo
      parameters:
      - name: providerId
        in: path
        description: Identifier of the provider to get the data for.
        required: true
        schema:
          type: string
          format: uuid
      - name: providerInfoType
        in: query
        description: 'If not specified, will return all data for the provider. Info types can be combined, ex.: `providerInfoType=licenses&providerInfoType=deaRegistrations`.'
        schema:
          type: array
          items:
            enum:
            - BasicInfo
            - Caqh
            - LiabilityInsurance
            - Education
            - Training
            - WorkHistory
            - DeaRegistrations
            - Licenses
            - BoardCertifications
            - Certificates
            - MedicaidEnrollment
            - Specialty
            - HospitalAffiliation
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              example:
                BasicInfo:
                  firstName: string
                  lastName: string
                  dateOfBirth: '2019-08-24T14:15:22.0000000Z'
                  ssn: '***'
                  id: 497f6eca-6276-4993-bfeb-53cbbbba6f08
                  credentialingStatus: string
                  aliases:
                  - firstName: string
                    lastName: string
                  addresses:
                  - state: AL
                    zipCode: string
                    city: string
                    addressLine1: string
                    type: Unspecified
                  emails:
                  - email: string
                    type: Unspecified
                  phone: string
                  languages:
                  - string
                  gender: string
                  ethnicity:
                  - enum
                  credentialedDate: '2019-08-24T14:15:22.0000000Z'
                  recredentialedDates:
                  - '2019-08-24T14:15:22.0000000Z'
                  providerType: string
                CaqhInfo:
                  caqhId: string
                LiabilityInsurance:
                - id: Guid
                  name: string
                  isSelfInsured: bool
                  originalEffectiveDate: Date
                  effectiveDate: Date
                  expirationDate: Date
                  CoverageType: enum
                  isUnlimitedCoverage: bool
                  includesTailCoverage: bool
                  occurrenceCoverageAmount: number
                  aggregateCoverageAmount: number
                  policyNumber: string
                  lastUpdatedAt: '2025-06-03T20:49:03.9129760Z'
                Education:
                - id: Guid
                  ecfmgNumber: string
                  ecfmgIssueDate: '2019-08-24T14:15:22.0000000Z'
                  graduateType: enum
                  schoolName: string
                  schoolCode: string
                  startDate: '2000-09-01T00:00:00.0000000Z'
                  endDate: '2000-09-01T00:00:00.0000000Z'
                  completed: bool
                  degree: string
                  lastUpdatedAt: '2025-06-03T20:49:03.9129760Z'
                Training:
                - id: Guid
                  trainingType: enum
                  institutionName: string
                  schoolCode: string
                  startDate: '2000-09-01T00:00:00.0000000Z'
                  endDate: '2000-09-01T00:00:00.0000000Z'
                  completed: bool
                  lastUpdatedAt: '2025-06-03T20:49:03.9129760Z'
                MedicaidEnrollment:
                - state: AL
                  nonVerifiedInfo:
                    effectiveDate: '2026-01-01'
                    providerType: string
                    providerSpeciality: string
                    address: string
                    inOutState: enum
                    issueDate: '2010-01-01'
                  id: 2939ccdc-4acf-4b3a-b2d2-40f1e078882a
                  lastUpdatedAt: '2025-06-03T20:49:03.9129760Z'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Server Error
      security:
      - Bearer: []
      x-codeSamples: []
