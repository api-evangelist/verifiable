          format: date-time
        id:
          type: string
          description: Unique identifier of the hospital affiliation.
          format: uuid
        status:
          enum:
          - Active
          - Inactive
          - Pending
          type: string
          description: Provider's non-admitting affiliation status.
        startDate:
          type: string
          description: Date provider's affiliation/privileges at the hospital began.
          format: date
        endDate:
