openapi: 3.2.0
info:
  title: Verifiable API Documentation Provider Profiles API
  description: '# Introduction


    This document contains the official documentation for the latest version of the Verifiable API.'
  version: 26.12.1.962
servers:
- url: https://discovery.verifiable.com/api
  description: Production
- url: https://discovery-staging.verifiable.com/api
  description: Staging
tags:
- name: ProviderProfiles
  description: These endpoints let you import a provider’s profile data from different sources (such as a provider’s National Provider Identifier (NPI) record).
paths:
  /providers/profiles/import/sources:
    get:
      tags:
      - ProviderProfiles
      summary: List provider profile import sources
      description: Returns a list of sources where you can import provider profile data from. You can choose a source to import from and select the parameters required for a successful request.
      operationId: ListProviderProfileImportSources
      parameters:
      - name: source
        in: query
        description: The source of the import to get profiles.
        schema:
          enum:
          - Npi
          - CaqhPo
          - AmericanMedicalAssociationPhysician
          - AmericanMedicalAssociationPhysicianAssistant
          type: string
          example: CaqhPo
      - name: sortedBy
        in: query
        schema:
          enum:
          - Name
          - Source
          type: string
      - name: sort
        in: query
        description: If set, the properties and directions the returned data will be sorted by.
        schema:
          type: object
          properties:
            Keys:
              enum:
              - Name
              - Source
              type: string
            Values:
              enum:
              - Asc
              - Desc
              type: string
      - name: offset
        in: query
        description: The offset for the page to start.
        deprecated: true
        schema:
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to render the page requested. To load the first page send an empty cursor, then the system will generate the cursors to go to the next and/or previous pages automatically.
        schema:
          type: string
      - name: count
        in: query
        description: The number of items to include in a single page.
        schema:
          type: integer
          format: int32
      - name: sortDirection
        in: query
        description: The direction the returned data will be sorted by.
        schema:
          enum:
          - Asc
          - Desc
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderProfileImportSourcePageModel'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Server Error
      security:
      - Bearer: []
  /providers/profiles/import:
    post:
      tags:
      - ProviderProfiles
      summary: Create a new provider profile import
      description: 'To import a profile from an external source, you must first create an import request. When the request is initiated, the provider profile record will be created with a “Pending” status. When complete, the status will change to “Completed”.


        If the request is successful, the provider profile will have a “Profile" value. If an error occurs, the profile will have a "FailureCode" and "FailureDescription" value.'
      operationId: CreateProviderProfileImport
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderProfileImportRequestModel'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderProfileImportModel'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Server Error
      security:
      - Bearer: []
    get:
      tags:
      - ProviderProfiles
      summary: List provider profile imports
      description: Returns a list of all the provider profiles that have been imported so far. You can filter the selection by source, status, providerId, get only latest record for each provider, and change the sorting and pages.
      operationId: ListProviderProfileImports
      parameters:
      - name: latest
        in: query
        description: If set, returns only the most recent import of each source type for a given provider.
        schema:
          type: boolean
      - name: status
        in: query
        description: If set, returns only the profiles with this status.
        schema:
          enum:
          - Pending
          - Working
          - Completed
          - Failed
          type: string
      - name: source
        in: query
        description: If set, returns only the profiles of this source.
        schema:
          enum:
          - Npi
          - CaqhPo
          - AmericanMedicalAssociationPhysician
          - AmericanMedicalAssociationPhysicianAssistant
          type: string
          example: CaqhPo
      - name: providerId
        in: query
        description: If set, returns only the imports for a given provider.
        schema:
          type: string
          format: uuid
      - name: sortedBy
        in: query
        schema:
          enum:
          - Id
          - Source
          - Status
          - Completed
          - Started
          type: string
      - name: sort
        in: query
        description: If set, the properties and directions the returned data will be sorted by.
        schema:
          type: object
          properties:
            Keys:
              enum:
              - Id
              - Source
              - Status
              - Completed
              - Started
              type: string
            Values:
              enum:
              - Asc
              - Desc
              type: string
      - name: offset
        in: query
        description: The offset for the page to start.
        deprecated: true
        schema:
          type: integer
          format: int32
      - name: cursor
        in: query
        description: The cursor to render the page requested. To load the first page send an empty cursor, then the system will generate the cursors to go to the next and/or previous pages automatically.
        schema:
          type: string
      - name: count
        in: query
        description: The number of items to include in a single page.
        schema:
          type: integer
          format: int32
      - name: sortDirection
        in: query
        description: The direction the returned data will be sorted by.
        schema:
          enum:
          - Asc
          - Desc
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderProfileImportPageModel'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Server Error
      security:
      - Bearer: []
  /providers/profiles/import/{importId}:
    get:
      tags:
      - ProviderProfiles
      summary: Get an existing provider profile import
      description: Returns a specific provider profile import model, allowing you to check the model status and get the profile value.
      operationId: GetProviderProfileImport
      parameters:
      - name: importId
        in: path
        description: Identifier of the provider profile import to get the data for.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderProfileImportModel'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Server Error
      security:
      - Bearer: []
  /providers/profiles/imports/{source}/parameters/{providerId}:
    get:
      tags:
      - ProviderProfiles
      summary: Get profile import parameters for a provider
      description: Returns the list of provider profile import parameters that will be used during a profile import.
      operationId: GetProviderImportParameters
      parameters:
      - name: providerId
        in: path
        description: The identifier of the provider for which the parameters should be returned.
        required: true
        schema:
          type: string
          format: uuid
      - name: source
        in: path
        description: The source of the import to get profiles.
        required: true
        schema:
          enum:
          - Npi
          - CaqhPo
          - AmericanMedicalAssociationPhysician
          - AmericanMedicalAssociationPhysicianAssistant
          type: string
          example: CaqhPo
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IProviderParameter'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Server Error
      security:
      - Bearer: []
components:
  schemas:
    ProviderProfileImportModel:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier associated with this provider profile import.
          format: uuid
        providerId:
          type: string
          description: The provider unique identifier associated with this profile import.
          format: uuid
        source:
          enum:
          - Npi
          - CaqhPo
          - AmericanMedicalAssociationPhysician
          - AmericanMedicalAssociationPhysicianAssistant
          type: string
          description: Source of the import.
          example: CaqhPo
        started:
          type: string
          description: TimeStamp of this import when started
          format: date-time
        completed:
          type: string
          description: TimeStamp of this import when completed or `null` if is still in progress.
          format: date-time
        status:
          enum:
          - Pending
          - Working
          - Completed
          - Failed
          type: string
          description: Status of the import. If it is `Pending` or `Working` it means that we are busy performing the import. Once the status is `Completed` or `Failed` the import is done.
        trigger:
          enum:
          - Manual
          - Automated
          type: string
          description: Type of trigger for this import.
        failureCode:
          enum:
          - DatabaseError
          - InvalidImportSourceError
          - UnknownError
          - ParseError
          - NpiSourceError
          - ImportError
          - ImportRequestError
          - SourceError
          - NoContent
          - BadRequest
          - Unauthorized
          - Forbidden
          - NotFound
          - NotAcceptable
          - RequestTimeout
          - TooManyRequests
          - InternalServerError
          - BadGateway
          - ServiceUnavailable
          - GatewayTimeout
          type: string
          description: If set it means there was an error during the import or `null` when no errors happened.
        failureReason:
          $ref: '#/components/schemas/FailureModel'
        profile:
          $ref: '#/components/schemas/ProviderProfileModel'
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/IProviderParameter'
      additionalProperties: false
    ProviderProfileImportRequestModel:
      required:
      - providerId
      - source
      type: object
      properties:
        providerId:
          type: string
          description: The provider unique identifier associated with this profile import.
          format: uuid
        source:
          enum:
          - Npi
          - CaqhPo
          - AmericanMedicalAssociationPhysician
          - AmericanMedicalAssociationPhysicianAssistant
          type: string
          description: Source of the import.
          example: CaqhPo
      additionalProperties: false
