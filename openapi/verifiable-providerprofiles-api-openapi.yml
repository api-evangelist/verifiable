          - ImportError
          - ImportRequestError
          - SourceError
          - NoContent
          - BadRequest
          - Unauthorized
          - Forbidden
          - NotFound
          - NotAcceptable
          - RequestTimeout
          - TooManyRequests
          - InternalServerError
          - BadGateway
          - ServiceUnavailable
