aid: verifiable
name: Verifiable
description: >-
  Verifiable is an API-first provider network management and credentialing
  platform for healthcare. Its RESTful API lets health plans, credentialing
  vendors, and digital health companies programmatically manage provider and
  facility records, run real-time primary-source verifications of licenses and
  credentials, continuously monitor providers for sanctions and exclusions, scan
  reference datasets, manage payers, payer plans, groups, and provider
  enrollments, drive credentialing requests, and receive events via webhooks.
  The platform is built API-first (Verifiable builds its own product on the same
  API) and is used as underlying credentialing infrastructure across healthcare.
  Backed by Craft Ventures.
