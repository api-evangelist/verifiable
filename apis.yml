- aid: verifiable:verifiable-monitoring-api
  name: Verifiable Monitoring API
  description: >-
    Endpoints to allow you to enable/disable monitoring or update monitoring settings for monitorable
    data.


    ## License Expiration Monitoring

    License Expiration Monitoring is a process that automatically performs verifications of licenses as
    they approach their expiration date. This process operates independently of a license's configured
    monitoring interval (e.g., Monthly, Yearly). Its purpose is to ensure timely updates and proactive
    management of expiring licenses.


    ### License Expiration Monitoring for Free Sources

    For licenses verified via free sources (those without pass-through fees), the Verifiable Platform
    follows a more frequent and proactive monitoring to ensure timely updates. This increased frequency
    applies regardless of the license's general monitoring interval. Verifications are performed at the
    following intervals, relative to the license expiration date:

    - Before license expiration: 90, 60, 28, 14, 7, 3, and 0 days

    - After license expiration: 3 days


    This means the Verifiable Platform will check the license 90 days before it expires, then 60 days
    before, and so on, until the day of expiration (0 days). A final check is performed 3 days after the
    expiration date.


    ### License Expiration Monitoring for Paid Sources

    For licenses verified via paid sources (those with pass-through fees), the Verifiable Platform follows
    a more streamlined monitoring for efficient management to minimize costs incurred to users.

    - After license expiration: 1 day


    As with free verification sources, these licenses will also continue to be monitored at their scheduled
    cadence regardless of this expiration check.
  humanURL: https://docs.discovery.verifiable.com/references/api
  baseURL: https://discovery.verifiable.com/api
  tags:
  - Monitoring
  properties:
